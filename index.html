<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wisp</title>
  <link rel="canonical" href="https://www.get-wisp-app.com/en/">
  <link rel="alternate" hreflang="x-default" href="https://www.get-wisp-app.com/en/">
  <script>
    (function () {
      // À compléter au fur et à mesure que tu ajoutes des langues
      var supported = ['fr','en'];
      var lang = null;
      var prefs = navigator.languages || [navigator.language || 'en'];
      for (var i = 0; i < prefs.length; i++) {
        var code = prefs[i].toLowerCase().split('-')[0];
        if (supported.indexOf(code) !== -1) { lang = code; break; }
      }
      if (!lang) lang = 'en';
      location.replace('/' + lang + '/' + location.search + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/en/"></noscript>
</head>
<body></body>
</html>
